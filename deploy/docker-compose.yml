# docker-compose de M4 (Ubicación y Disponibilidad)
# Guardar en: deploy/docker-compose.yml
# Correr desde deploy/:  docker compose up --build

name: m4

services:
  # Postgres local. Misma versión mayor que Supabase (17).
  # Al arrancar por primera vez ejecuta, en orden alfabético, todos los .sql
  # de supabase/migrations (los timestamps garantizan el orden correcto).
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"   # puerto de tu PC : puerto del contenedor (5433 para no chocar con un Postgres propio)
    volumes:
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
      - m4-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

