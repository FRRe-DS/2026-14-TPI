# CI/CD de la API de M4 (G14).
# En cada pull request: compilacion y tests, analisis de seguridad y prueba de punta a punta.
# Al entrar a main (o al crear un tag v...), solo si todo lo anterior pasa, publica la imagen.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/frre-ds/m4-g14

jobs:
  tests:
    name: Compilacion y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Tests, con un minimo de 60% de lineas cubiertas
        run: |
          # La herramienta de cobertura se instala aca, en la misma version que vitest, sin tocar package.json
          VERSION=$(node -p "require('./node_modules/vitest/package.json').version")
          npm install --no-save "@vitest/coverage-v8@$VERSION"
          npm test -- --coverage --coverage.include='src/**/*.ts' --coverage.reporter=text --coverage.thresholds.lines=60

  seguridad:
    name: Analisis de seguridad (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Analizar el codigo y frenar ante hallazgos graves
        run: semgrep scan --config p/javascript --config p/typescript --config p/dockerfile --metrics=off --severity ERROR --error src Dockerfile

  e2e:
    name: Prueba de punta a punta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build -t "$IMAGE:ci" .
      - name: Encender el ambiente (API, base, Redis y datos de prueba)
        run: |
          printf 'IMAGE_TAG=ci\nDB_PASSWORD=%s\n' "$(openssl rand -hex 12)" > deploy/.env
          docker compose -f deploy/compose.ambiente.yml up -d --wait --wait-timeout 180
      - name: Correr la prueba
        run: python3 e2e/flujo.py
      - name: Mostrar logs si algo fallo
        if: failure()
        run: docker compose -f deploy/compose.ambiente.yml logs --tail 100

  imagen:
    name: Construir y publicar la imagen
    needs: [tests, seguridad, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Iniciar sesion en el registro
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calcular las etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Construir (y publicar si no es un pull request)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-aws:
    name: Desplegar M4 en AWS EC2
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-g14
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transferir y desplegar la imagen de este commit
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_DEPLOY_SSH_KNOWN_HOSTS }}
          EC2_ENDPOINT: ${{ vars.AWS_DEPLOY_EC2_ENDPOINT }}
          EC2_PRIVATE_IP: ${{ vars.AWS_DEPLOY_EC2_PRIVATE_IP }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?}" "${SSH_KNOWN_HOSTS:?}" "${EC2_ENDPOINT:?}" "${EC2_PRIVATE_IP:?}"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_ec2() {
            ssh -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o HostKeyAlias=m4-g14-ec2 -o HostKeyAlgorithms=ssh-ed25519 \
              -o "ProxyCommand=aws ec2-instance-connect open-tunnel --instance-connect-endpoint-id $EC2_ENDPOINT --private-ip-address %h --remote-port 22 --max-tunnel-duration 600" \
              "ubuntu@$EC2_PRIVATE_IP" "$@"
          }
          image="$IMAGE:$GITHUB_SHA"
          docker pull "$image"
          docker save "$image" | gzip -1 | ssh_ec2 sudo docker load
          ssh_ec2 bash -s -- "$GITHUB_SHA" < deploy/desplegar-ec2.sh
